name: MacOS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "macos-build"
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Init submodules
        run: |
          git submodule update --init --depth 1 vendor/dawn
          git submodule update --init --recursive vendor/spdlog vendor/imgui vendor/assimp vendor/flecs vendor/tracy vendor/stb vendor/ImGuizmo vendor/JoltPhysics vendor/ozz-animation

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Configure
        run: cmake --preset osx-release

      - name: Build
        run: cmake --build build/osx-release -j

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReEngine-macOS
          path: build/osx-release/bin/
          retention-days: 30
